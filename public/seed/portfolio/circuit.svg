    </pattern>
    <pattern id="railholes" x="110" y="150" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="13" width="20" height="8" rx="4" fill="#8ea1ac"/>
    </pattern>
  </defs>

  <!-- bench mat -->
  <rect width="800" height="600" fill="#dcebe6"/>
