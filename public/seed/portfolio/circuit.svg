<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Koblingsbrett med automatsikring, kontaktor og rekkeklemmer på skinne, en boks med start- og stoppknapp og tent signallampe, og et multimeter med målepinner.</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
