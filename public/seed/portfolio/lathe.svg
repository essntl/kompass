<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">En aksel med to diametre spent opp i en dreiebenk. Dreiestålet står mot ansatsen, og spon krøller seg under emnet.</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c5ddd6" stroke-width="1.5"/>
    </pattern>
    <pattern id="thread" width="10" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 10 0" stroke="#52646e" stroke-width="2.5"/>
    </pattern>
    <pattern id="turned" width="6" height="56" patternUnits="userSpaceOnUse" x="446" y="222">
      <path d="M3 3V53" stroke="#9aaeb9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- wall -->
  <rect width="800" height="600" fill="#dcebe6"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#0e5a50" stroke-width="1.5" opacity="0.45">
    <path d="M20 32h24M32 20v24M756 32h24M768 20v24"/>
  </g>

  <!-- bed -->
  <rect x="-10" y="436" width="820" height="174" fill="#0e5a50" stroke="#14201d" stroke-width="3"/>
  <path d="M0 450H800" stroke="#2c8073" stroke-width="5"/>
  <rect x="-10" y="540" width="820" height="70" fill="#0a4038"/>
  <path d="M-10 540H810" stroke="#14201d" stroke-width="3"/>
  <!-- lead screw -->
  <rect x="-10" y="482" width="820" height="16" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <rect x="-10" y="483.500" width="820" height="13" fill="url(#thread)"/>
  <!-- ways -->
  <rect x="-10" y="416" width="820" height="20" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <path d="M0 422H800" stroke="#eef2f4" stroke-width="4"/>

  <!-- headstock -->
  <rect x="-10" y="104" width="160" height="332" fill="#0e5a50" stroke="#14201d" stroke-width="3"/>
  <path d="M0 116H142" stroke="#2c8073" stroke-width="6" stroke-linecap="round"/>
  <rect x="24" y="140" width="96" height="60" rx="8" fill="#0a4038" stroke="#14201d" stroke-width="3"/>
  <circle cx="52" cy="170" r="14" fill="#f2a20c" stroke="#14201d" stroke-width="3"/>
  <path d="M52 170l7-9" stroke="#14201d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="92" cy="170" r="14" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <path d="M92 170l-9-6" stroke="#14201d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="44" cy="330" r="12" fill="#2b7a4b" stroke="#14201d" stroke-width="3"/>
  <circle cx="82" cy="330" r="12" fill="#b93a2b" stroke="#14201d" stroke-width="3"/>
  <!-- spindle nose -->
  <rect x="150" y="204" width="24" height="92" fill="#52646e" stroke="#14201d" stroke-width="3"/>

  <!-- tailstock -->
  <path d="M724 176H810V436H684V404L724 356Z" fill="#0e5a50" stroke="#14201d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M734 188H800" stroke="#2c8073" stroke-width="6" stroke-linecap="round"/>
  <path d="M752 176 742 138" stroke="#14201d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="740" cy="132" r="11" fill="#f2a20c" stroke="#14201d" stroke-width="3"/>
  <rect x="660" y="226" width="66" height="48" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <path d="M664 236H722" stroke="#eef2f4" stroke-width="5"/>
  <path d="M664 265H722" stroke="#9aaeb9" stroke-width="6"/>
  <path d="M620 250 660 234V266Z" fill="#52646e" stroke="#14201d" stroke-width="3" stroke-linejoin="round"/>

  <!-- chuck -->
  <rect x="174" y="146" width="90" height="208" rx="6" fill="#9aaeb9" stroke="#14201d" stroke-width="3"/>
  <path d="M180 160H258" stroke="#c3d1d9" stroke-width="8" stroke-linecap="round"/>
  <path d="M180 338H258" stroke="#7d8f99" stroke-width="10" stroke-linecap="round"/>
  <path d="M200 148V352M240 148V352" stroke="#52646e" stroke-width="2.500"/>
  <rect x="211" y="172" width="18" height="18" rx="3" fill="#37464f" stroke="#14201d" stroke-width="2.500"/>
  <rect x="211" y="310" width="18" height="18" rx="3" fill="#37464f" stroke="#14201d" stroke-width="2.500"/>

  <!-- workpiece: raw bar in the chuck, turned to a smaller diameter towards the centre -->
  <rect x="262" y="205" width="178" height="90" fill="#b3c2cb" stroke="#14201d" stroke-width="3"/>
  <path d="M266 218H436" stroke="#dfe7eb" stroke-width="10"/>
  <path d="M266 281H436" stroke="#8ea1ac" stroke-width="14"/>
  <path d="M440 222H612L620 230V270L612 278H440Z" fill="#d3dde3" stroke="#14201d" stroke-width="3" stroke-linejoin="round"/>
  <rect x="446" y="224" width="162" height="52" fill="url(#turned)"/>
  <path d="M444 232H612" stroke="#ffffff" stroke-width="7"/>
  <path d="M444 269H612" stroke="#9aaeb9" stroke-width="8"/>
  <path d="M612 222V278" stroke="#14201d" stroke-width="2"/>
  <path d="M440 222H612L620 230V270L612 278H440Z" fill="none" stroke="#14201d" stroke-width="3" stroke-linejoin="round"/>

  <!-- chuck jaws grip the bar -->
  <g fill="#52646e" stroke="#14201d" stroke-width="3" stroke-linejoin="round">
    <path d="M264 152H294V174H310V205H264Z"/>
    <path d="M264 348H294V326H310V295H264Z"/>
  </g>
  <path d="M270 160H288M270 340H288" stroke="#7d8f99" stroke-width="4" stroke-linecap="round"/>

  <!-- centre line -->
  <path d="M160 250H712" stroke="#0e5a50" stroke-width="1.5" stroke-dasharray="22 6 4 6" opacity="0.8"/>

  <!-- apron with handwheel -->
  <rect x="392" y="436" width="156" height="92" rx="4" fill="#0e7c6b" stroke="#14201d" stroke-width="3"/>
  <path d="M400 446H540" stroke="#3aa08f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="438" cy="486" r="29" fill="none" stroke="#14201d" stroke-width="11"/>
  <circle cx="438" cy="486" r="29" fill="none" stroke="#c3d1d9" stroke-width="5"/>
  <path d="M438 460V512M412 486H464" stroke="#14201d" stroke-width="5"/>
  <circle cx="438" cy="486" r="8" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <circle cx="458" cy="466" r="6" fill="#37464f" stroke="#14201d" stroke-width="2.500"/>
  <path d="M510 492 524 462" stroke="#14201d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="526" cy="458" r="9" fill="#f2a20c" stroke="#14201d" stroke-width="3"/>
  <circle cx="510" cy="494" r="7" fill="#c3d1d9" stroke="#14201d" stroke-width="2.500"/>

  <!-- carriage, tool post and tool -->
  <rect x="372" y="364" width="196" height="52" rx="4" fill="#0e7c6b" stroke="#14201d" stroke-width="3"/>
  <path d="M380 374H560" stroke="#3aa08f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="538" cy="396" r="9" fill="#c3d1d9" stroke="#14201d" stroke-width="3"/>
  <rect x="424" y="316" width="92" height="48" rx="4" fill="#52646e" stroke="#14201d" stroke-width="3"/>
  <path d="M432 326H508" stroke="#7d8f99" stroke-width="5" stroke-linecap="round"/>
  <rect x="494" y="296" width="12" height="20" fill="#c3d1d9" stroke="#14201d" stroke-width="2.500"/>
  <rect x="482" y="286" width="36" height="12" rx="3" fill="#37464f" stroke="#14201d" stroke-width="2.500"/>
  <rect x="438" y="294" width="34" height="34" fill="#37464f" stroke="#14201d" stroke-width="3"/>
  <path d="M444 279 467 285 461 305 438 299Z" fill="#f2a20c" stroke="#14201d" stroke-width="2.500" stroke-linejoin="round"/>
  <circle cx="452.500" cy="292" r="3" fill="#14201d"/>

  <!-- swarf -->
  <g fill="none" stroke-width="3.500" stroke-linecap="round">
    <path d="M436 284c-16-2-28 8-24 20s20 12 24 2-6-16-14-10-4 16 4 14" stroke="#2f6fb0"/>
    <path d="M396 338c-12-6-26 0-26 12s14 16 22 8 0-18-10-14-8 14 0 14" stroke="#7d8f99"/>
    <path d="M330 398c-10-8-24-4-26 6s8 16 18 12 8-16-2-16-12 10-4 12" stroke="#2f6fb0"/>
    <path d="M598 396c-10-8-24-4-26 6s8 16 18 12 8-16-2-16-12 10-4 12" stroke="#7d8f99"/>
    <path d="M246 402c10-10 24-6 26 4s-8 16-18 12-8-14 2-16" stroke="#7d8f99"/>
  </g>

  <!-- diameter callout -->
  <path d="M560 222 588 150H690" fill="none" stroke="#0e5a50" stroke-width="1.5"/>
  <circle cx="560" cy="222" r="3.500" fill="#0e5a50"/>
  <text x="594" y="140" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" fill="#0b4a42">Ø 20 ±0,05</text>
</svg>
