<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">To stålplater sveiset sammen med en jevn sveisestreng, sett ovenfra. Sveisepistolen står ved enden av strengen.</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c5ddd6" stroke-width="1.5"/>
    </pattern>
    <pattern id="ripple" x="383" y="92" width="34" height="12" patternUnits="userSpaceOnUse">
      <path d="M1 1Q17 14 33 1" fill="none" stroke="#37464f" stroke-width="2"/>
      <path d="M5 0Q17 8 29 0" fill="none" stroke="#c3d1d9" stroke-width="1.5"/>
    </pattern>
    <clipPath id="plates"><rect x="150" y="90" width="500" height="420"/></clipPath>
  </defs>

  <!-- bench mat -->
  <rect width="800" height="600" fill="#dcebe6"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#0e5a50" stroke-width="1.5" opacity="0.45">
    <path d="M20 32h24M32 20v24M756 32h24M768 20v24M20 568h24M32 556v24M756 568h24M768 556v24"/>
  </g>

  <!-- dimension line -->
  <g fill="none" stroke="#0e5a50" stroke-width="1.5">
    <path d="M150 58h500M150 46v34M650 46v34"/>
    <path d="M150 58l12-5v10zM650 58l-12-5v10z" fill="#0e5a50"/>
  </g>
  <rect x="368" y="46" width="64" height="24" fill="#dcebe6"/>
  <text x="400" y="64" text-anchor="middle" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0b4a42">500</text>

  <!-- wire brush lying beside the plates -->
  <g>
    <rect x="62" y="214" width="46" height="300" rx="8" fill="#14201d" opacity="0.1"/>
    <rect x="52" y="330" width="40" height="176" rx="14" fill="#d9bf8a" stroke="#14201d" stroke-width="3"/>
    <path d="M62 356v124M72 350v136M82 356v124" stroke="#b89a5e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="48" y="204" width="48" height="134" rx="6" fill="#8a6a2a" stroke="#14201d" stroke-width="3"/>
    <g stroke="#eef2f4" stroke-width="2.5" stroke-linecap="round">
      <path d="M58 218v106M66 214v114M74 218v106M82 214v114M90 220v102"/>
    </g>
    <g stroke="#52646e" stroke-width="1.5" stroke-linecap="round">
      <path d="M62 216v110M70 220v104M78 214v114M86 218v106"/>
    </g>
  </g>

  <!-- plates -->
  <rect x="164" y="104" width="500" height="420" rx="6" fill="#14201d" opacity="0.12"/>
  <g stroke="#14201d" stroke-width="3" stroke-linejoin="round">
    <rect x="150" y="90" width="249" height="420" rx="4" fill="#c3d1d9"/>
    <rect x="401" y="90" width="249" height="420" rx="4" fill="#cbd7de"/>
  </g>
  <!-- light edges and a few scratches -->
  <path d="M156 97h238M407 97h238" stroke="#eef2f4" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#9aaeb9" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M186 150l58 22M206 420l84 -18M176 300l40 8M520 160l92 30M560 440l60 -26M470 470l44 10M590 300l36 -6M230 232l30 -4"/>
  </g>

  <!-- heat tint around the weld: straw, blue, dark -->
  <g clip-path="url(#plates)">
    <rect x="346" y="40" width="108" height="394" rx="40" fill="#e6cf95" opacity="0.75"/>
    <rect x="362" y="40" width="76" height="380" rx="30" fill="#8fa9c4" opacity="0.8"/>
    <rect x="373" y="40" width="54" height="372" rx="24" fill="#6f808a"/>
  </g>
  <path d="M344 90h112" stroke="#14201d" stroke-width="3"/>

  <!-- open joint below the weld, with a tack -->
  <path d="M400 404V509" stroke="#14201d" stroke-width="3"/>
  <ellipse cx="400" cy="474" rx="10" ry="7" fill="#8697a1" stroke="#14201d" stroke-width="2.5"/>

  <!-- weld bead -->
  <rect x="383" y="86" width="34" height="318" rx="15" fill="#8697a1" stroke="#14201d" stroke-width="3"/>
  <rect x="383" y="92" width="34" height="300" rx="15" fill="url(#ripple)"/>

  <!-- chalk tick: approved -->
  <path d="M520 262l26 30 54-74" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- glow and sparks at the end of the bead -->
  <circle cx="400" cy="398" r="30" fill="#f2a20c" opacity="0.28"/>
  <g stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round">
    <path d="M360 372l-26-16M352 404l-34 6M368 432l-22 24M396 446l-4 30M430 364l16-28M388 356l-8-30M444 388l30-12"/>
  </g>
  <g fill="#c97a06">
    <circle cx="318" cy="372" r="3.5"/><circle cx="330" cy="444" r="3"/><circle cx="372" cy="486" r="3.5"/>
    <circle cx="462" cy="340" r="3"/><circle cx="368" cy="318" r="3"/><circle cx="302" cy="412" r="2.5"/>
  </g>
  <circle cx="400" cy="398" r="14" fill="#c8553d" stroke="#14201d" stroke-width="3"/>
  <circle cx="400" cy="398" r="7.5" fill="#f2a20c"/>
  <circle cx="400" cy="398" r="3" fill="#fbedc8"/>

  <!-- MAG torch -->
  <g transform="translate(400 398) rotate(36)">
    <rect x="70" y="-8" width="380" height="46" rx="20" fill="#14201d" opacity="0.12"/>
    <path d="M5 0H26" stroke="#eef2f4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M5 0H26" stroke="#14201d" stroke-width="1" opacity="0.5"/>
    <rect x="98" y="-12" width="118" height="24" rx="6" fill="#37464f" stroke="#14201d" stroke-width="3"/>
    <path d="M24-9 84-18V18L24 9Z" fill="#c97a06" stroke="#14201d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30-4 78-11" stroke="#f2a20c" stroke-width="4" stroke-linecap="round"/>
    <rect x="84" y="-21" width="16" height="42" rx="3" fill="#52646e" stroke="#14201d" stroke-width="3"/>
    <rect x="252" y="20" width="56" height="18" rx="5" fill="#f2a20c" stroke="#14201d" stroke-width="3"/>
    <rect x="208" y="-25" width="260" height="50" rx="16" fill="#0e5a50" stroke="#14201d" stroke-width="3"/>
    <path d="M222-14h200" stroke="#2c8073" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#0a4038" stroke-width="5" stroke-linecap="round">
      <path d="M250-4v18M270-4v18M290-4v18M310-4v18M330-4v18"/>
    </g>
  </g>
</svg>
