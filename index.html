<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in sync with the active theme by src/app/theme.ts -->
    <meta name="theme-color" content="#F5F3EE" />
    <meta name="description" content="Kompass samler timeplan, reise, fravær, portefølje og lærlingplass på ett sted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kompass" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Kompass</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('kompass:settings');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
